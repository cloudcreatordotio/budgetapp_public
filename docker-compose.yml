# Offline local mode: SQL Server in Docker; the app runs on the host via `dotnet run`,
# or — with `--profile app` — as the container image pulled from ACR.
# Requires .env with SQL_SA_PASSWORD (see .env.example).
services:
  app:
    # Deliberately the ACR image, not a local build: `docker compose --profile app up`
    # proves the pushed artifact runs. Requires `az acr login --name <your-acr-name>`
    # first (or run deploy/build-push.sh, which logs in, builds, and pushes).
    image: ${REGISTRY:-myacr.azurecr.io}/budgetapp:${BUDGETAPP_IMAGE_TAG:-latest}
    platform: linux/amd64 # image is amd64 (App Service); runs via Rosetta locally
    container_name: budgetapp-web
    profiles: ["app"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Containers have no user-secrets; all config arrives as env vars (`__` maps to `:`).
      KeyVault__Uri: "" # offline — no Key Vault
      ConnectionStrings__BudgetApp: "Server=db,1433;Database=BudgetApp;User Id=sa;Password=${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=True"
      Database__MigrateOnStartup: "true"
      Database__SeedSampleData: "true" # offline database only — never set in Azure
      # GitHub OAuth is intentionally unconfigured here: the local OAuth app's callback
      # is https://localhost:7017/signin-github, which can never point at this container.
      # The app boots and serves /healthz regardless (sentinel in Program.cs).

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64 # image is amd64-only; runs via Rosetta on Apple Silicon
    container_name: budgetapp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - budgetapp-sql-data:/var/opt/mssql
    healthcheck:
      # $$ so compose passes the variable through to the container's shell unexpanded
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  budgetapp-sql-data:
