#cloud-config
# BudgetApp load-balancer VM (Session 6). Rendered by infra/modules/lb.bicep via
# loadTextContent + replace of the __APP_FQDN__ / __PUBLIC_HOST__ / __VAULT_URI__
# tokens, then passed as customData. Idempotent by construction: a rebuilt VM
# re-provisions itself, pulling the Origin CA certificate from Key Vault with
# its managed identity (fetch-origin-cert.sh) once the secrets exist.

package_update: true
packages:
  - nginx
  - jq

write_files:
  # Reverse proxy: Cloudflare -> nginx -> App Service private endpoint.
  # Traps covered: SNI (App Service rejects TLS without it), Host = app host
  # with the public host in X-Forwarded-Host, websocket upgrade + HTTP/1.1 and
  # a long read timeout on /_blazor, http -> https redirect.
  - path: /etc/nginx/sites-available/budgetapp.conf
    permissions: '0644'
    content: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          ''      close;
      }

      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          return 301 https://$host$request_uri;
      }

      server {
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;
          server_name __PUBLIC_HOST__;

          # Cloudflare Origin CA pair once fetch-origin-cert.sh has installed it;
          # until then a temporary self-signed pair at the same paths.
          ssl_certificate     /etc/nginx/ssl/origin.crt;
          ssl_certificate_key /etc/nginx/ssl/origin.key;

          location / {
              proxy_pass https://__APP_FQDN__;
              proxy_http_version 1.1;
              proxy_ssl_server_name on;
              proxy_ssl_name __APP_FQDN__;
              proxy_set_header Host __APP_FQDN__;
              proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
          }

          # Blazor Server circuit: long-lived websocket.
          location /_blazor {
              proxy_pass https://__APP_FQDN__;
              proxy_http_version 1.1;
              proxy_ssl_server_name on;
              proxy_ssl_name __APP_FQDN__;
              proxy_set_header Host __APP_FQDN__;
              proxy_set_header X-Forwarded-Host __PUBLIC_HOST__;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Forwarded-For $remote_addr;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 1h;
              proxy_send_timeout 1h;
          }
      }

  # Regenerates the Cloudflare real-ip config from the published ranges so
  # nginx logs (and anything rate-limiting later) see real client addresses.
  # Never hand-edit /etc/nginx/conf.d/cloudflare-real-ip.conf — re-run this.
  - path: /usr/local/bin/update-cloudflare-real-ip.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      tmp=$(mktemp)
      {
        echo "# Generated by update-cloudflare-real-ip.sh on $(date -u +%FT%TZ). Do not edit."
        echo "real_ip_header CF-Connecting-IP;"
        for url in https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6; do
          while read -r range; do
            [ -n "$range" ] && echo "set_real_ip_from $range;"
          done < <(curl -fsS --max-time 30 "$url")
        done
      } > "$tmp"
      # A truncated fetch must never replace a good config.
      if [ "$(grep -c '^set_real_ip_from' "$tmp")" -lt 10 ]; then
        echo "Suspiciously few Cloudflare ranges fetched; keeping existing config." >&2
        rm -f "$tmp"
        exit 1
      fi
      install -m 0644 "$tmp" /etc/nginx/conf.d/cloudflare-real-ip.conf
      rm -f "$tmp"
      nginx -t && systemctl reload nginx

  # Pulls the Cloudflare Origin CA certificate + key from Key Vault with the
  # VM's managed identity (Key Vault Secrets User, over the vault's private
  # endpoint) and installs them for nginx. Before the secrets exist it keeps
  # the self-signed pair and exits 0, so cloud-init succeeds on first boot;
  # deploy/install-origin-cert.sh re-triggers it via az vm run-command.
  - path: /usr/local/bin/fetch-origin-cert.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      VAULT_URI="__VAULT_URI__"
      CERT_SECRET="cloudflare-origin-cert"
      KEY_SECRET="cloudflare-origin-key"
      SSL_DIR="/etc/nginx/ssl"

      token=$(curl -fsS --max-time 30 -H "Metadata: true" \
        "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net" \
        | jq -r .access_token)

      fetch_secret() {
        curl -fsS --max-time 30 -H "Authorization: Bearer $token" \
          "${VAULT_URI}secrets/$1?api-version=7.4" | jq -r .value
      }

      if ! cert=$(fetch_secret "$CERT_SECRET") || ! key=$(fetch_secret "$KEY_SECRET"); then
        echo "Origin certificate secrets not readable yet; keeping current certificate." >&2
        exit 0
      fi
      case "$cert" in *"BEGIN CERTIFICATE"*) ;; *)
        echo "Secret $CERT_SECRET is not a PEM certificate; aborting." >&2; exit 1;;
      esac
      case "$key" in *"PRIVATE KEY"*) ;; *)
        echo "Secret $KEY_SECRET is not a PEM private key; aborting." >&2; exit 1;;
      esac

      install -d -m 0755 "$SSL_DIR"
      umask 077
      printf '%s\n' "$cert" > "$SSL_DIR/origin.crt.new"
      printf '%s\n' "$key" > "$SSL_DIR/origin.key.new"
      openssl x509 -in "$SSL_DIR/origin.crt.new" -noout
      mv "$SSL_DIR/origin.crt.new" "$SSL_DIR/origin.crt"
      mv "$SSL_DIR/origin.key.new" "$SSL_DIR/origin.key"
      chmod 0644 "$SSL_DIR/origin.crt"
      chmod 0600 "$SSL_DIR/origin.key"
      nginx -t && systemctl reload nginx
      echo "Origin CA certificate installed and nginx reloaded."

runcmd:
  # Temporary self-signed pair so nginx can start before the Origin CA cert
  # exists (Traps: order of operations at the edge). Never overwrites a real one.
  - [ bash, -c, "install -d -m 0755 /etc/nginx/ssl && if [ ! -s /etc/nginx/ssl/origin.crt ]; then openssl req -x509 -nodes -newkey rsa:2048 -days 90 -subj '/CN=__PUBLIC_HOST__' -keyout /etc/nginx/ssl/origin.key -out /etc/nginx/ssl/origin.crt && chmod 0600 /etc/nginx/ssl/origin.key; fi" ]
  - [ bash, -c, "rm -f /etc/nginx/sites-enabled/default && ln -sf /etc/nginx/sites-available/budgetapp.conf /etc/nginx/sites-enabled/budgetapp.conf" ]
  - [ bash, -c, "/usr/local/bin/update-cloudflare-real-ip.sh" ]
  - [ bash, -c, "/usr/local/bin/fetch-origin-cert.sh" ]
  - [ bash, -c, "nginx -t && systemctl enable --now nginx && systemctl reload nginx" ]
